<header th:fragment="header"
    class="fixed top-0 left-0 right-0 z-50 bg-surface-container-lowest/90 backdrop-blur-xl border-b border-outline-variant/30 shadow-sm">
    <div class="h-16 w-full max-w-[1440px] mx-auto px-margin flex items-center justify-between gap-space-md">
        <div class="flex items-center gap-space-xl">
            <a class="flex items-center gap-space-sm group" data-path="inicio-explorar" href="/">
                <span
                    class="font-headline-sm text-headline-sm text-on-surface tracking-tight font-bold">LevelStart</span>
            </a>
            <nav class="hidden md:flex items-center gap-space-xs p-space-xs">
                <a class="px-space-md py-space-sm font-label-md text-label-md text-on-surface-variant hover:text-on-surface hover:bg-surface-container rounded-lg transition-all"
                    data-path="eventos-privados-comunidad" href="/eventos-privados">
                    Eventos Privados (Comunidad)
                </a>
            </nav>
        </div>
        <div class="flex items-center gap-space-md">

            <a sec:authorize="!isAuthenticated()"
                class="hidden sm:inline-flex items-center justify-center px-space-md py-space-sm rounded-lg bg-surface-container-lowest text-on-surface font-label-md text-label-md hover:bg-surface-container hover:text-primary transition-all border border-outline-variant"
                data-path="iniciar-sesion-registro" href="/registro">
                Iniciar Sesión / Registro
            </a>


            
            <div sec:authorize="isAuthenticated()" class="relative group/profile" id="nav-profile-menu">
                <details class="relative group/profile">

                    <!-- Botón siempre visible -->
                    <summary
                        class="list-none cursor-pointer select-none flex items-center gap-space-sm pl-space-sm pr-space-xs py-space-xs rounded-xl bg-surface-container border border-outline-variant/40 hover:bg-surface-container-high transition-all focus:outline-none">

                        <div class="hidden xl:flex flex-col text-right">
                            <span class="font-label-md text-label-md text-on-surface group-hover/profile:text-primary transition-colors leading-tight font-semibold">
                                Mi Perfil
                            </span>
                            <span class="font-label-sm text-label-sm text-tertiary font-semibold flex items-center justify-end gap-1">
                                Conectado
                            </span>
                        </div>

                        <div class="relative flex items-center justify-center">
                            <div class="w-9 h-9 rounded-full bg-surface-container-lowest ring-2 ring-primary/30 group-hover/profile:ring-primary flex items-center justify-center overflow-hidden border border-outline-variant/30">
                                <span class="material-symbols-outlined text-primary text-[20px]">sports_esports</span>
                            </div>
                            <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full bg-tertiary-container ring-2 ring-surface-container-lowest" title="Estado: Conectado"></span>
                        </div>

                        <span class="material-symbols-outlined text-on-surface-variant text-[20px] transition-transform duration-200 group-open/profile:rotate-180">
                            expand_more
                        </span>
                    </summary>

                    <!-- Menú desplegable -->
                    <div class="absolute right-0 top-full mt-space-xs w-72 rounded-2xl bg-surface-container-lowest border border-outline-variant/40 shadow-xl shadow-surface-dim/40 py-space-sm px-space-xs z-50 transition-all flex flex-col gap-1">

                        <div class="px-space-md py-space-sm flex items-center gap-space-sm">
                            <div class="relative w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary font-bold font-headline-sm border border-primary/20 shrink-0">
                                <span class="material-symbols-outlined text-[24px]">person</span>
                                <span class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-tertiary ring-2 ring-surface-container-lowest"></span>
                            </div>

                            <div class="truncate flex-1">
                                <div class="flex items-center gap-space-xs">
                                    <p class="font-headline-sm text-label-md text-on-surface font-bold truncate">
                                        Viper_Apex
                                    </p>
                                    <span class="px-1.5 py-0.5 rounded text-[10px] bg-primary/10 text-primary font-bold uppercase tracking-wider">
                                        Tier 1
                                    </span>
                                </div>
                                <p class="font-body-sm text-[12px] text-on-surface-variant truncate">
                                    viper@gamernexus.gg
                                </p>
                            </div>
                        </div>

                        <div class="h-px bg-outline-variant/30 my-space-xs mx-space-sm"></div>

                        <nav class="flex flex-col gap-0.5">
                            <a class="flex items-center gap-space-sm px-space-md py-space-xs rounded-lg text-on-surface hover:bg-surface-container hover:text-primary transition-all font-label-md text-label-md group/item"
                                href="#">
                                <span class="material-symbols-outlined text-[20px] text-on-surface-variant group-hover/item:text-primary transition-colors">person</span>
                                <span>Mi Perfil Gamer &amp; Stats</span>
                            </a>

                            <a class="flex items-center gap-space-sm px-space-md py-space-xs rounded-lg text-on-surface hover:bg-surface-container hover:text-on-surface transition-all font-label-md text-label-md group/item"
                                href="#">
                                <span class="material-symbols-outlined text-[20px] text-on-surface-variant group-hover/item:text-on-surface transition-colors">settings</span>
                                <span>Ajustes de Cuenta</span>
                            </a>
                        </nav>

                        <div class="h-px bg-outline-variant/30 my-space-xs mx-space-sm"></div>

                        <form th:action="@{/logout}" method="post">
                            <button type="submit"
                                class="flex items-center gap-space-sm px-space-md py-space-xs rounded-lg text-error hover:bg-error-container/30 transition-all font-label-md text-label-md group/logout w-full">

                                <span class="material-symbols-outlined text-[20px] text-error group-hover/logout:scale-110 transition-transform">
                                    logout
                                </span>

                                <span class="font-semibold">Cerrar Sesión</span>
                            </button>
                        </form>
                    </div>
                </details>
            </div>




        </div>
    </div>
</header>
