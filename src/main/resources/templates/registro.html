<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{registro :: contenido})}">

<body>

    <main th:fragment="contenido" class="w-full pt-16 bg-surface min-h-[calc(100vh-16rem)]">
      <div class="flex flex-col w-full">
        <div class="relative w-full overflow-hidden py-space-xl px-margin flex items-center justify-center">
          <div class="absolute -top-32 -left-20 w-96 h-96 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
          <div
            class="absolute bottom-0 right-10 w-[420px] h-[420px] bg-secondary-container/20 rounded-full blur-3xl pointer-events-none">
          </div>
          <div class="absolute top-1/2 left-1/3 w-64 h-64 bg-tertiary-fixed/30 rounded-full blur-2xl pointer-events-none">
          </div>
          <div class="w-full max-w-[1240px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-space-xl items-start relative z-10">
    
            <section class="lg:col-span-7 lg:col-start-4">
              <div
                class="w-full bg-surface-container-lowest rounded-2xl p-space-lg sm:p-space-xl shadow-lg border border-outline-variant/50 relative">
                <div
                  class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-space-xs pb-space-lg border-b border-outline-variant/20 mb-space-lg">
                  <div>
                    <h2 class="font-headline-lg text-headline-lg text-on-surface">Crear Cuenta</h2>
                    <p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">Regístrate para competir y unirte
                      a squads verificados</p>
                  </div>
                  <div
                    class="flex items-center gap-space-xs self-start sm:self-center px-space-sm py-space-xs rounded bg-surface-container-low border border-outline-variant/40">
                    <span class="material-symbols-outlined text-secondary text-[16px]">verified_user</span>
                    <span class="font-label-sm text-label-sm text-secondary font-bold uppercase tracking-wider">Registro
                      Oficial</span>
                  </div>
                </div>
                
                <form class="space-y-space-md" id="gamer-signup-form" onsubmit="event.preventDefault(); return false;">
                  <div>
                    <label class="block font-headline-sm text-[14px] text-on-surface mb-1 font-semibold" for="fullName">
                      Nombre completo o Gamertag real <span class="text-error">*</span>
                    </label>
                    <div class="relative flex items-center">
                      <span
                        class="material-symbols-outlined absolute left-3 text-outline text-[20px] pointer-events-none">person</span>
                      <input
                        class="w-full bg-[#f8fafc] text-on-surface placeholder:text-outline border border-[#cbd5e1] pl-10 pr-space-md py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-md text-body-md transition-all"
                        id="fullName" name="fullName" placeholder="Ej. Mateo 'Viper' Morales" required="" type="text" />
                    </div>
                  </div>
                  <div>
                    <label class="block font-headline-sm text-[14px] text-on-surface mb-1 font-semibold" for="email">
                      Correo electrónico gamer <span class="text-error">*</span>
                    </label>
                    <div class="relative flex items-center">
                      <span
                        class="material-symbols-outlined absolute left-3 text-outline text-[20px] pointer-events-none">alternate_email</span>
                      <input
                        class="w-full bg-[#f8fafc] text-on-surface placeholder:text-outline border border-[#cbd5e1] pl-10 pr-space-md py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-md text-body-md transition-all"
                        id="email" name="email" placeholder="proplayer@dominio.gg" required="" type="email" />
                    </div>
                  </div>
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-space-md">
                    <div>
                      <label class="block font-headline-sm text-[14px] text-on-surface mb-1 font-semibold" for="password">
                        Contraseña <span class="text-error">*</span>
                      </label>
                      <div class="relative flex items-center">
                        <span
                          class="material-symbols-outlined absolute left-3 text-outline text-[20px] pointer-events-none">lock</span>
                        <input
                          class="w-full bg-[#f8fafc] text-on-surface placeholder:text-outline border border-[#cbd5e1] pl-10 pr-10 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-md text-body-md transition-all"
                          id="password" name="password" oninput="evalPasswordStrength(this.value)"
                          placeholder="Mínimo 8 caracteres" required="" type="password" />
                        <button class="absolute right-3 text-outline hover:text-on-surface focus:outline-none"
                          onclick="togglePasswordVisibility('password', this)" title="Mostrar/Ocultar" type="button">
                          <span class="material-symbols-outlined text-[20px]">visibility</span>
                        </button>
                      </div>
                    </div>
                    <div>
                      <label class="block font-headline-sm text-[14px] text-on-surface mb-1 font-semibold"
                        for="confirmPassword">
                        Confirmar contraseña <span class="text-error">*</span>
                      </label>
                      <div class="relative flex items-center">
                        <span
                          class="material-symbols-outlined absolute left-3 text-outline text-[20px] pointer-events-none">shield</span>
                        <input
                          class="w-full bg-[#f8fafc] text-on-surface placeholder:text-outline border border-[#cbd5e1] pl-10 pr-10 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-md text-body-md transition-all"
                          id="confirmPassword" name="confirmPassword" oninput="checkMatchPassword()"
                          placeholder="Repite tu contraseña" required="" type="password" />
                        <button class="absolute right-3 text-outline hover:text-on-surface focus:outline-none"
                          onclick="togglePasswordVisibility('confirmPassword', this)" title="Mostrar/Ocultar"
                          type="button">
                          <span class="material-symbols-outlined text-[20px]">visibility</span>
                        </button>
                      </div>
                    </div>
                  </div>
                  
                  
                  <div class="pt-space-xs">
                    <label class="flex items-start gap-space-sm cursor-pointer group select-none">
                      <div class="relative flex items-center mt-0.5">
                        <input class="peer sr-only" id="terms" name="terms" required="" type="checkbox" />
                        <div
                          class="w-5 h-5 rounded border border-[#cbd5e1] bg-[#f8fafc] peer-checked:bg-primary-container peer-checked:border-primary-container flex items-center justify-center transition-all">
                          <span
                            class="material-symbols-outlined text-[16px] text-on-primary opacity-0 peer-checked:opacity-100 font-bold">check</span>
                        </div>
                      </div>
                      <span class="font-body-sm text-body-sm text-on-surface-variant leading-snug">
                        Acepto los <a class="text-primary font-semibold hover:underline" href="#">Términos de
                          Servicio</a>, el <a class="text-primary font-semibold hover:underline" href="#">Código de
                          Conducta Gamer</a> y las políticas de juego limpio de LevelStart.
                      </span>
                    </label>
                  </div>
                  <button
                    class="w-full py-3.5 px-space-lg rounded-xl font-headline-sm text-headline-sm text-on-primary font-bold bg-gradient-to-r from-primary-container via-primary to-secondary shadow-md hover:shadow-lg hover:scale-[1.008] active:scale-[0.99] transition-all flex items-center justify-center gap-space-sm mt-space-md"
                    id="submit-btn" type="submit">
                    <span>Crear Cuenta Gamer</span>
                    <span class="material-symbols-outlined text-[22px]">rocket_launch</span>
                  </button>
                  <div class="text-center pt-space-xs">
                    <span class="font-body-md text-body-md text-on-surface-variant">¿Ya tienes cuenta gamer
                      registrada?</span>
                    <a class="font-headline-sm text-[14px] text-primary hover:text-primary-container font-semibold transition-colors ml-1.5 inline-flex items-center gap-0.5 group"
                      data-path="iniciar-sesion-registro" href="/login">
                      <span>Iniciar Sesión</span>
                      <span
                        class="material-symbols-outlined text-[18px] group-hover:translate-x-0.5 transition-transform">login</span>
                    </a>
                  </div>
                </form>
              </div>
            </section>
          </div>
        </div>
      </div>
    </main>

</body>
</html>
